[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter-ai"
version = "0.0.1"
description = "Deterministic CLI scripts to list jobs and apply to them, orchestrated by external AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "NavesDev" }]
keywords = ["cli", "jobs", "automation", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "aiosmtpd>=1.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "import-linter>=2.0",
]

[project.urls]
Homepage = "https://github.com/NavesDev/job-hunter-ai"
Changelog = "https://github.com/NavesDev/job-hunter-ai/blob/main/CHANGELOG.md"
Issues = "https://github.com/NavesDev/job-hunter-ai/issues"

[project.scripts]
list-jobs = "job_hunter_ai.cli.main:list_jobs_app"
apply-job = "job_hunter_ai.cli.main:apply_job_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_hunter_ai = ["py.typed", "infra/repository/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Enforces the dependency rule from docs/ARCHITECTURE.md. Run with `lint-imports`.
[tool.importlinter]
root_package = "job_hunter_ai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain depends on nothing"
type = "forbidden"
source_modules = ["job_hunter_ai.domain"]
forbidden_modules = [
  "job_hunter_ai.application",
  "job_hunter_ai.infra",
  "job_hunter_ai.config",
  "job_hunter_ai.cli",
]

[[tool.importlinter.contracts]]
name = "application receives ports by injection, never imports infra or cli"
type = "forbidden"
source_modules = ["job_hunter_ai.application"]
forbidden_modules = ["job_hunter_ai.infra", "job_hunter_ai.cli"]

[[tool.importlinter.contracts]]
name = "infra implements ports without knowing application or cli"
type = "forbidden"
source_modules = ["job_hunter_ai.infra"]
forbidden_modules = ["job_hunter_ai.application", "job_hunter_ai.cli"]

[[tool.importlinter.contracts]]
name = "domain stays free of third-party dependencies"
type = "forbidden"
source_modules = ["job_hunter_ai.domain"]
forbidden_modules = ["typer", "yaml", "dotenv", "sqlite3"]
