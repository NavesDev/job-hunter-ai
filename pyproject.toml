[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter-ai"
version = "0.1.0"
description = "Deterministic CLI scripts to list jobs and apply to them, orchestrated by external AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "NavesDev" }]
keywords = ["cli", "jobs", "automation", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/NavesDev/job-hunter-ai"
Changelog = "https://github.com/NavesDev/job-hunter-ai/blob/main/CHANGELOG.md"
Issues = "https://github.com/NavesDev/job-hunter-ai/issues"

[project.scripts]
list-jobs = "job_hunter_ai.cli.main:list_jobs_app"
apply-job = "job_hunter_ai.cli.main:apply_job_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_hunter_ai = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
