# NON-SENSITIVE settings for the `geekhunter` source.
# Copy to config/local/sources/geekhunter.yaml and adjust. Credentials do NOT belong
# here — a platform credential goes in .env with a GEEKHUNTER_ prefix.
#
# Everything below is optional: with no file at all the source collects the
# unfiltered listing at the default pace.

# Filters applied to the listing. An unknown name or an unknown value raises
# INVALID_INPUT before any request goes out — the platform silently ignores a bad
# filter and returns everything, which would hand you the wrong jobs.
filters:
  # remote | hybrid | on-site | remote-in-city
  workModality: "remote"
  # intern | entry | mid | senior | manager
  experienceLevel: "senior"
  # Free text, matched against the title and the description.
  # searchTerm: "python"
  # Free text, in the platform's own "City - UF" shape.
  # cityName: "São Paulo - SP"
  # Whole numbers, monthly, in BRL.
  # minSalary: 10000
  # maxSalary: 20000
  # ISO 8601 instant.
  # publishedAfter: "2026-08-30T00:00:00Z"

http:
  # Identify the tool. The platform's CDN answers 403 to an anonymous library agent.
  user_agent: "job-hunter-ai/0.1 (+https://github.com/NavesDev/job-hunter-ai)"
  timeout_seconds: 30
  # One request at a time, at a human pace. Lower it only if you know why.
  min_request_interval_seconds: 1.0
